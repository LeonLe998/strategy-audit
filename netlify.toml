[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # Bài VIP đi kèm function, không nằm trong thư mục deploy công khai
  included_files = ["private_data/vip_articles/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTTP Security Headers cho toàn bộ trang
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache vĩnh viễn cho static hashed assets (JS/CSS/fonts sinh ra từ Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache cho thư viện dữ liệu JSON công khai (phục vụ tức thì từ CDN Edge)
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
