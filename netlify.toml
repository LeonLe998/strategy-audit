[build]
  command = "npm run build"
  publish = "dist"

# Chặn truy cập hoặc tải trực tiếp file markdown VIP riêng tư
[[redirects]]
  from = "/data/vip_articles/*"
  to = "/vip"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers bảo vệ website toàn diện
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Tối ưu hóa bộ nhớ đệm cho static assets đã hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

